name: run report

# MANUAL ONLY. There is no schedule -- this fires exactly when you press the
# button in the Actions tab and at no other time. Pushing code does not trigger
# it either, which matters because otherwise every edit would burn a run and
# overwrite that week's snapshot with whatever the data looked like at that moment.
#
# Cost: nothing. Public repos get unlimited GitHub Actions minutes, and the
# pipeline uses only free unauthenticated sources (Sleeper, nflverse,
# DynastyProcess). No ANTHROPIC_API_KEY is set or needed.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week to build. Leave blank for the current week."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: build the report
        run: python3 run.py ${{ github.event.inputs.week }}

      - name: commit results
        run: |
          git config user.name  "gleague-bot"
          git config user.email "actions@github.com"
          git add snapshots out
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "week report $(date -u +%Y-%m-%d)"
          git push
